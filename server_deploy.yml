- hosts: server_as_tun_mode
  remote_user: root
  vars_files:
    - install_config/group_vars/server_as_tun_mode.yml
  roles:
    - kernel-ml
    - framework
    - mrzcpd
    - tsg-env-tun-mode
    - sapp
    - tsg_master
    - kni
    - firewall
    - tsg_app
    - http_healthcheck
    - certstore
    - redis
    - cert-redis
    - maat-redis
    - tfe
    - telegraf_statistic
    - telegraf_collect
    - tsg_device_tag
    - reboot

- hosts: packet_dump_server
  remote_user: root
  vars_files:
    - install_config/group_vars/server_as_tun_mode.yml
  roles:
    - framework
    - packet_dump

- hosts: app_global
  remote_user: root
  vars_files:
    - install_config/group_vars/app_global.yml
  roles:
    - app_global
