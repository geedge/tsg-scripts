---
- name: "copy mrzcpd to destination server"
  synchronize:
    src: "{{ role_path }}/files/"
    dest: "/tmp/ansible_deploy/"

- name: "install mrzcpd"
  yum:
    name: /tmp/ansible_deploy/mrzcpd-4.4.5.cebe25a-1.el7.x86_64.rpm
    state: present

- name: "update sysconfig/mrzcpd"
  template:
    src: "{{ role_path }}/templates/mrzcpd.j2"
    dest: /etc/sysconfig/mrzcpd

- name: "update mrglobal.conf - traffic_mirror"
  template:
    src: "{{ role_path }}/templates/traffic_mirror/mrglobal.conf.traffic_mirror.j2"
    dest: /opt/mrzcpd/etc/mrglobal.conf

- name: "enable mrenv"
  systemd:
    name: mrenv
    enabled: yes
    daemon_reload: yes

- name: "enable mrzcpd"
  systemd:
    name: mrzcpd
    enabled: yes
    daemon_reload: yes

- name: "enable prometheus output - monit_device"
  systemd:
    name: mrapm_device
    enabled: yes
    daemon_reload: yes

- name: "enable prometheus output - monit_stream"
  systemd:
    name: mrapm_stream
    enabled: yes
    daemon_reload: yes

- name: "disable mrtunnat on slave"
  systemd:
    name: mrtunnat
    enabled: no
    daemon_reload: yes
