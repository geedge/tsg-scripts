- name: "copy cert-redis to destination server"
  copy:
    src: "{{ role_path }}/files/"
    dest: /home/tsg
    mode: 0755

- name: "install cert-redis"
  shell: cd /home/tsg/cert-redis;sh install.sh

- name: "start cert-redis"
  systemd:
    name: cert-redis.service
    state: started
    daemon_reload: yes
    enabled: yes
