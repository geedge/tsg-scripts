- name: "copy cert-redis file to dest"
  copy:
    src: "{{ role_path }}/files/"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: "cert-redis.conf" , dest: "/etc" , mode: "0644" } 
    - { src: "cert-redis.service" , dest: "/usr/lib/systemd/system" , mode: "0644" }

- name: "start cert-redis"
  systemd:
    name: cert-redis.service
    state: started
    daemon_reload: yes
    enabled: yes
