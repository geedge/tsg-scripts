--- 
- name: 'Copy tsg-diagnose file to device'
  copy: 
    src: "{{item.src}}"
    dest: "{{item.dest}}"
    mode: "{{item.mode}}"
  with_items:
    - { src: "{{ role_path }}/files/", dest: "/tmp/ansible_deploy/tsg-diagnose", mode: '0755' }
    
- name: 'Install docker env rpm'
  include: DockerEnv.yml

- name: 'Install Tsg-diagnose'
  include: TsgDiagnose.yml