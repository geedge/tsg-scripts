---
- name: "copy app_proto_identify rpm package destination server"
  copy:
    src: "{{ role_path }}/files/"
    dest: /tmp/ansible_deploy/

- name: "install app_proto_identify"
  yum:
    name: "{{ app_packages }}"
    state: present
    skip_broken: yes
  vars:
    app_packages:
      - /tmp/ansible_deploy/app_proto_identify-1.0.7.a5113ba-2.el7.x86_64.rpm
