- hosts: control-blade-all
  tasks:
  - name: "killall tfe"
    command: "killall tfe"

  - name: "find corefiles to delete"
    find:
      paths: /home/tsg/tfe/
      patterns: core.*
    register: corefiles_to_delete

  - name: "cleanup coredump"
    file:
      state: absent
      path: '{{ item.path }}'
    with_items: "{{ corefiles_to_delete.files }}"
  
  - name: "cleanup RESTART.log"
    file:
      state: absent
      path: /home/tsg/tfe/RESTART.log
