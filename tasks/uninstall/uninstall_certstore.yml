- hosts: 
    - adc_mcn0
  remote_user: root
  tasks:
    - name: "uninstall certstore: stop certstore service"
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      with_items:
        - certstore.service
    
    - name: "uninstall certstore: delete memory.conf"
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /etc/systemd/system/certstore.service.d/memory.conf
    
    - name: "uninstall certstore: uninstall certstore rpm package"
      yum:
        name: certstore
        state: absent