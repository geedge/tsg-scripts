- hosts: 
    - adc_mcn0
  remote_user: root
  tasks:
    - name: "uninstall kni: stop sapp.service"
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      with_items:
        - sapp.service
  
    - name: "uninstall kni: uninstall kni rpm package"
      yum:
        name: kni
        state: absent