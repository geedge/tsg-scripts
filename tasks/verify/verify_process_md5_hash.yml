- hosts: adc_mcn0
  remote_user: root
  tasks:
    - name: "verify sapp  md5 in mcn0"
      shell: md5sum /home/mesasoft/sapp_run/sapp
      register: sapp_md5sum

    - name: assert
      assert:
        that:
          - sapp_md5sum.stdout.find('1ca2eb92e4269066c6a056e41bb394b3') != -1
        fail_msg: "FAIL"
        success_msg: "PASS"
