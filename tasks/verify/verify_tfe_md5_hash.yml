- hosts: 
    - adc_mcn1
    - adc_mcn2
    - adc_mcn3
  remote_user: root
  tasks:
    - name: "verify tfe  md5 in mcn0"
      shell: md5sum /opt/tsg/tfe/bin/tfe
      register: tfe_md5sum

    - name: assert
      assert:
        that:
          - tfe_md5sum.stdout.find('0f45d2844dbff2edbde44bab0359cead') != -1
        fail_msg: "FAIL"
        success_msg: "PASS"
