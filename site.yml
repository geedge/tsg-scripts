- hosts: blade-03
  roles:
    - tfe
  vars_files:
    - "vars/common.yml"
    - "vars/tfe.yml"
  vars:
  - nic_mgr:
      name: eth0
  - nic_data_incoming:
      name: eth3
      address: 172.16.254.1
      mac: AA:BB:CC:DD:EE:FF
      peer: 172.16.254.254
  - nic_traffic_mirror:
      name: eth4



