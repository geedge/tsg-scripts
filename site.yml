- hosts: blade-00
  roles:
    - kernel-ml
    - framework
    - mrzcpd
    - kni
  vars_files:
    - "vars/common.yml"
    - "vars/kni.yml"
  vars:
  - nic_mgr:
      name: enp7s0
  - nic_data_incoming:
      name: ens1f4
  - nic_inner_ctrl:
      name: ens1.100
  - nic_to_tfe:
      tfe0:
        name: ens1f5
      tfe1: 
        name: ens1f6
      tfe2: 
        name: ens1f7

- hosts: blade-01
  roles:
    - kernel-ml
    - framework
    - mrzcpd
    - tfe
  vars_files:
    - "vars/common.yml"
    - "vars/tfe.yml"
  vars:
  - nic_mgr:
      name: enp7s0
  - nic_data_incoming:
      name: ens1f1
      mac: AA:BB:CC:DD:EE:FF
  - nic_traffic_mirror:
      name: ens1f2
      use_mrzcpd: 1

- hosts: blade-02 blade-03
  roles:
    - kernel-ml
    - framework
    - mrzcpd
    - tfe
  vars_files:
    - "vars/common.yml"
    - "vars/tfe.yml"
  vars:
  - nic_mgr:
      name: enp7s0
  - nic_data_incoming:
      name: ens8f1
      mac: AA:BB:CC:DD:EE:FF
  - nic_traffic_mirror:
      name: ens8f2
      use_mrzcpd: 1

- hosts: certstore
  roles:
    - framework
  become: yes
  become_user: root
