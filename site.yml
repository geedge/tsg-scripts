vars:
  - maat_redis_server:
    - address: 192.168.11.243
    - port: 6379
    - db: 4
  - cert_store_server:
    - address: 192.168.10.8
    - port: 9991
  - log_kafkabrokers:
    - address: "0.0.0.0:9092"
  - log_minio:
    - address: "10.4.35.42-46;"
    - port: 9000

  roles:
    - framework

- hosts: blade-00
  - roles:
    - framework
    - sapp
    - kni

- hosts: blade-01
  - roles:
    - net-ctrlblade
    - tfe-kmod
    - tfe
  - vars:
    nic_mgr:
      - name: eth0
    nic_data_incoming:
      - name: eth3
      - address: 172.16.254.1
      - mac: AA:BB:CC:DD:EE:FF
      - peer: 172.16.254.254
    nic_traffic_mirror:
      - name: eth4

- hosts: blade-02
    - net-ctrlblade
    - tfe-kmod
    - tfe
  nic_mgr:
    - name: eth0
    nic_data_incoming:
      name: eth3
      inet_addr: 172.16.254.2
      inet6_addr: fd00::1
      gw_inet_addr: 172.16.254.254
      gw_ether_addr: BB:CC:DD:EE:FF:AA
    nic_traffic_mirror:
      name: eth4

- hosts: blade-03
    - net-ctrlblade
    - tfe-kmod
    - tfe

- hosts: blade-04
    - net-ctrlblade
    - tfe-kmod
    - tfe
