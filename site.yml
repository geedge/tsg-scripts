- hosts: blade-03
  roles:
    - framework
    - mrzcpd
    - tfe
  vars_files:
    - "vars/common.yml"
    - "vars/tfe.yml"
  vars:
  - nic_mgr:
      name: eth0
  - nic_data_incoming:
      name: eth3
      mac: AA:BB:CC:DD:EE:FF
  - nic_traffic_mirror:
      name: eth4
      use_mrzcpd: 1

- hosts: blade-00
  roles:
    - kni
  vars_files:
    - "vars/kni.yml"
  vars:
  - nic_mgr:
      name: eth0
  - nic_data_incoming:
      name: eth6
      ip: 192.168.17.1
      mask: 255.255.255.0
      gw: 192.168.17.254
  - nic_inner_ctrl:
      name: eth2.100
  - nic_to_tfe:
    - id: 0
      name: eth7
    - id: 1
      name: eth8
    - id: 2
      name: eth9


