- hosts: blade-00
  roles:
    - framework
    - mrzcpd
    - kni
  vars_files:
    - "vars/common.yml"
    - "vars/kni.yml"
  vars:
  - nic_mgr:
      name: enp7s0
  - nic_data_incoming:
      name: ens1f4
      ip: 192.168.17.1
      mask: 255.255.255.0
      gw: 192.168.17.254
  - nic_inner_ctrl:
      name: ens1.100
  - nic_to_tfe:
      tfe0:
        name: ens1f5
      tfe1: 
        name: ens1f6
      tfe2: 
        name: ens1f7

- hosts: blade-03
  roles:
    - framework
    - mrzcpd
    - tfe
  vars_files:
    - "vars/common.yml"
    - "vars/tfe.yml"
  vars:
  - nic_mgr:
      name: enp7s0
  - nic_data_incoming:
      name: ens1f1
      mac: AA:BB:CC:DD:EE:FF
  - nic_traffic_mirror:
      name: ens1f2
      use_mrzcpd: 1
      
