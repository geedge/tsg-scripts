- hosts: uninstall_server
  remote_user: root
  roles:
    - backup_framework_config
    - backup_marsio_config
    - backup_sapp_config
    - backup_tfe_config
    - backup_tsgenv_config
    - kernel
    - marsio
    - kni
    - tsg_app
    - tsg_master
    - firewall
    - sapp
    - tfe
    - certstore
    - cert_redis
    - clotho
    - packet_dump
    - http_healthcheck
    - framework
    - telegraf_statistic
    - remove_files
    - remove_framework_files
    - remove_marsio_files
    - remove_tfe_files
  vars_files:
    - uninstall_config/group_vars/uninstall_vars.yml
    - roles/package_list/20.09.yml

