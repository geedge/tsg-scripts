- name: "[certredis after 20.09] stop cert-redis"
  systemd:
    name: cert-redis
    state: stopped
    enabled: no
  when: uninstall.certredis == 1
  ignore_errors: true

- name: "[certredis after 20.09] remove cert-redis files"
  file:
    path: /opt/tsg/cert-redis
    state: absent
  when: remove.certredis == 1
