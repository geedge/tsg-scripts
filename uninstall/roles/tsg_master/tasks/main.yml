####################
#Uninstall tsg_master
- name: "[uninstall tsg_master] stop sapp"
  systemd:
    name: sapp
    state: stopped
    enabled: no
  when:
    - uninstall.tsgmaster == 1
  ignore_errors: true

- name: "[uninstall tsg_master] uninstall tsg_master"
  yum:
    name:
      - "{{ tsg_master }}"
    state: absent
  when: uninstall.tsgmaster == 1

