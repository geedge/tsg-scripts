- name: "[uninstall framework] uninstall framework"
  yum:
    name:
      - "{{ libcjson }}"
      - "{{ libdocument }}"
      - "{{ libmaatframe }}"
      - "{{ libMESA_field_stat }}"
      - "{{ libMESA_field_stat2 }}"
      - "{{ libMESA_handle_logger }}"
      - "{{ libMESA_htable }}"
      - "{{ libMESA_prof_load }}"
      - "{{ librdkafka }}"
      - "{{ librulescan }}"
      - "{{ libwiredcfg }}"
      - "{{ libWiredLB }}"
      - "{{ lz4 }}"
    state: absent
  when: uninstall.framework == 1

- name: "[uninstall framework] uninstall framework"
  yum:
    name:
      - "{{ libtsglua }}"
    state: absent
  when: uninstall.framework == 1
  ignore_errors: true
