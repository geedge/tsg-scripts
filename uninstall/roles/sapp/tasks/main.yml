####################
#Uninstall sapp
- name: "[uninstall sapp] stop sapp"
  systemd:
    name: sapp
    state: stopped
    enabled: no
  when:
    - uninstall.sapp == 1
  ignore_errors: true

- name: "[uninstall sapp] uninstall sapp"
  yum:
    name:
      - "{{ sapp }}"
    state: absent
  when: uninstall.sapp == 1
