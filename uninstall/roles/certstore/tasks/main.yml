- name: "[uninstall certstore] stop certstore"
  systemd:
    name: certstore
    state: stopped
    enabled: no
  when:
    - uninstall.certstore == 1
  ignore_errors: true

- name: "[uninstall certstore] uninstall certstore"
  yum:
    name:
      - "{{ certstore }}"
    state: absent
  when: uninstall.certstore == 1

