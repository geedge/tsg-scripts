####################
#Uninstall Marsio
- name: "[uninstall marsio] stop mrzcpd"
  systemd:
    name: mrzcpd
    state: stopped
    enabled: no
  when:
    - uninstall.marsio == 1
  ignore_errors: true

- name: "[uninstall marsio] stop mrtunnat"
  systemd:
    name: mrtunnat
    state: stopped
    enabled: no
  when:
    - uninstall.marsio == 1
  ignore_errors: true

- name: "[uninstall marsio]  uninstall mrzcpd"
  yum:
    name:
      - "{{ mrzcpd }}"
    state: absent
  when: uninstall.marsio == 1
