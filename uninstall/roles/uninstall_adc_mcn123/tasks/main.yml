####################
#Uninstall Kernel
- name: "reset default kernel"
  shell: grub2-set-default '{{ origin_kernel }}'
  when: uninstall.kernel == 1

- name: "reboot"
  reboot:
  when: uninstall.kernel == 1

- name: "uninstall tfe-kmod and kernel"
  yum:
    name:
      - "{{ tfe_kmod }}"
      - "{{ dkms }}"
      - "{{ kernel_ml }}"
      - "{{ kernel_ml_devel }}"
      - "{{ elfutils_libelf_devel }}"
      - "{{ zlib_devel }}"
    state: absent
  when: uninstall.kernel == 1
  ignore_errors: true

####################
#Uninstall Marsio
- name: stop mrzcpd
  systemd:
    name: mrzcpd
    state: stopped
    enabled: no
  when: 
    - backup.marsio == 1
    - uninstall.marsio == 1
  ignore_errors: true

- name: stop mrtunnat
  systemd:
    name: mrtunnat
    state: stopped
    enabled: no
  when: 
    - backup.marsio == 1
    - uninstall.marsio == 1
  ignore_errors: true

- name: create backup_dest_path
  file:
    path: "{{ backup_dest_path }}"
    state: directory
  when: backup.marsio == 1

- name: backup /opt/mrzcpd to destination path
  archive:
    path: /opt/mrzcpd
    dest: "{{ backup_dest_path }}/mrzcpd_{{ uninstall_version }}_{{ date }}.zip"
    format: zip
  when: backup.marsio == 1

- name: uninstall mrzcpd
  yum:
    name:
      - "{{ mrzcpd }}"
    state: absent
  when: uninstall.marsio == 1

- name: remove marsio files
  file:
    path: /opt/mrzcpd
    state: absent
  when: remove.marsio == 1

- name: remove mrzcpd.service
  file:
    path: /usr/lib/systemd/system/mrzcpd.service
    state: absent
  when: remove.marsio == 1

- name: remove mrtunnat.service
  file:
    path: /usr/lib/systemd/system/mrtunnat.service
    state: absent
  when: remove.marsio == 1

####################
#Uninstall tfe
- name: stop tfe
  systemd:
    name: tfe
    state: stopped
    enabled: no
  when:
    - backup.tfe == 1
    - uninstall.tfe == 1
  ignore_errors: true 

- name: stop tfe-env
  systemd:
    name: tfe-env
    state: stopped
    enabled: no
  when:
    - backup.tfe == 1
    - uninstall.tfe == 1
  ignore_errors: true

- name: create backup_dest_path
  file:
    path: "{{ backup_dest_path }}"
    state: directory
  when: backup.tfe == 1

- name: backup /opt/tsg/tfe/conf to destination path
  archive:
    path: /opt/tsg/tfe/conf
    dest: "{{ backup_dest_path }}/tfe_conf_{{ uninstall_version }}_{{ date }}.zip"
    format: zip
  when: backup.tfe == 1

- name: uninstall tfe
  yum:
    name:
      - "{{ tfe }}"
    state: absent
  when: uninstall.tfe == 1

- name: remove /opt/tsg/tfe
  file:
    path: /opt/tsg/tfe
    state: absent
  when: remove.tfe == 1

- name: remove tfe.service
  file:
    path: /usr/lib/systemd/system/tfe.service
    state: absent
  when: remove.tfe == 1

- name: remove tfe-env.service
  file:
    path: /usr/lib/systemd/system/tfe-env.service
    state: absent
  when: remove.tfe == 1

- name: remove tfe-env-tun-mode.service
  file:
    path: /usr/lib/systemd/system/tfe-env-tun-mode.service
    state: absent
  when: remove.tfe == 1

####################
#Uninstall framework
- name: create backup_dest_path
  file:
    path: "{{ backup_dest_path }}"
    state: directory
  when: backup.framework == 1

- name: backup /home/tsg/certstore to destination path
  archive:
    path: /opt/MESA
    dest: "{{ backup_dest_path }}/opt_MESA_{{ uninstall_version }}_{{ date }}.zip"
    format: zip
  when: backup.framework == 1

- name: uninstall framework
  yum:
    name:
      - "{{ libcjson }}"
      - "{{ libdocument }}"
      - "{{ libmaatframe }}"
      - "{{ libMESA_field_stat }}"
      - "{{ libMESA_field_stat2 }}"
      - "{{ libMESA_handle_logger }}"
      - "{{ libMESA_htable }}"
      - "{{ libMESA_prof_load }}"
      - "{{ librdkafka }}"
      - "{{ librulescan }}"
      - "{{ libwiredcfg }}"
      - "{{ libWiredLB }}"
      - "{{ lz4 }}"
    state: absent
  when: uninstall.framework == 1

- name: remove framework files
  file:
    path: /opt/MESA
    state: absent
  when: remove.framework == 1

