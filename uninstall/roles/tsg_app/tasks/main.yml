#Tsg-app
- name: "[uninstall tsg-app] stop sapp"
  systemd:
    name: sapp
    state: stopped
    enabled: no
  when:
    - uninstall_version >= 20.09
    - uninstall.tsg_app == 1
  ignore_errors: true

- name: "[uninstall tsg-app] uninstall tsg_app"
  yum:
    name:
      - "{{ app_sketch_local }}"
      - "{{ app_control_plug }}"
      - "{{ app_proto_identify }}"
      - "{{ app_master }}"
    state: absent
  when:
    - uninstall_version >= 20.09
    - uninstall.tsg_app == 1

