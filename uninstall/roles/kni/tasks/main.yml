####################
#Uninstall kni
- name: "[uninstall kni] stop sapp"
  systemd:
    name: sapp
    state: stopped
    enabled: no
  when:
    - uninstall.kni == 1
  ignore_errors: true

- name: "[uninstall kni] uninstall kni"
  yum:
    name:
      - "{{ kni }}"
    state: absent
  when: uninstall.kni == 1

