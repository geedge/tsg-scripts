########################################
#Kni Config
kni:
  global:
    tfe_node_count: 3
  watch_dog:
    switch: 1
  maat:
    readconf_mode: 2
  send_logger:
    switch: 1
  tfe_nodes:
    tfe0_enabled: 1
    tfe1_enabled: 1
    tfe2_enabled: 1

